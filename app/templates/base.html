<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Speaker-Aware Speech To Text for ChatGPT/Claude{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{% block page %}{% endblock %}"{% block bodyattrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">🎙️ Speaker-Aware Speech To Text for ChatGPT/Claude</a>
    <nav>
      <a href="/">Upload &middot; Results</a>
      <a href="/speakers">Speakers</a>
    </nav>
    <span class="health" id="health"></span>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
