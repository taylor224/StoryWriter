{% extends "base.html" %}
{% block page %}index{% endblock %}

{% block content %}
<section class="card">
  <h2>음성 파일 업로드</h2>
  <form id="upload-form">
    <div class="dropzone" id="dropzone">
      <input type="file" id="file" name="file" accept="audio/*,video/*" hidden>
      <p class="dz-main">여기에 파일을 끌어다 놓거나 <button type="button" class="link" id="pick">찾아보기</button></p>
      <p class="dz-sub">mp3 · wav · m4a · flac · ogg · mp4 등</p>
      <p class="dz-file" id="filename"></p>
    </div>

    <div class="grid">
      <label>
        결과 이름
        <input type="text" id="name" value="{{ default_name }}" placeholder="{{ default_name }}">
        <small>비워두면 오늘 날짜로 저장됩니다. 같은 이름이 있으면 -2, -3 이 붙습니다.</small>
      </label>

      <label>
        언어
        <select id="language">
          <option value="">자동 감지 (권장)</option>
          <option value="ko">한국어 고정</option>
          <option value="en">영어 고정</option>
          <option value="ja">일본어 고정</option>
          <option value="zh">중국어 고정</option>
        </select>
        <small>한/영이 섞이면 자동 감지가 원문을 잘 유지합니다.</small>
      </label>

      <label>
        최소 화자 수 <span class="muted">(선택)</span>
        <input type="number" id="min_speakers" min="1" max="20" placeholder="예: 2">
      </label>

      <label>
        최대 화자 수 <span class="muted">(선택)</span>
        <input type="number" id="max_speakers" min="1" max="20" placeholder="예: 4">
        <small>참석 인원을 알면 넣어주세요. 정확도가 크게 올라갑니다.</small>
      </label>
    </div>

    <label class="full">
      용어사전 · 초기 프롬프트
      <textarea id="initial_prompt" rows="3"
        placeholder="예) 클로아, KLOA, 스프린트 회고, OKR">{{ glossary }}</textarea>
      <small>고유명사·회사 용어를 넣으면 인식 정확도가 올라갑니다. 등록된 화자 이름은 자동으로 함께 전달됩니다. 여기 입력한 내용은 다음에도 유지됩니다.</small>
    </label>

    <button type="submit" class="primary" id="submit">전사 시작</button>
  </form>
</section>

<section class="card" id="jobs-card">
  <h2>작업 현황</h2>
  <div id="jobs" class="joblist"><p class="muted">작업 없음</p></div>
</section>

<section class="card">
  <h2>저장된 결과</h2>
  <div id="results" class="resultlist"><p class="muted">아직 결과가 없습니다.</p></div>
</section>
{% endblock %}
